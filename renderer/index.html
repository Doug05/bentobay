<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>BentoBay</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <aside>
    <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" rx="3" fill="#7c8cff"/><rect x="13" y="2" width="9" height="9" rx="3" fill="#3ecf8e"/><rect x="2" y="13" width="9" height="9" rx="3" fill="#f0b43c"/><rect x="13" y="13" width="9" height="9" rx="3" fill="#f0605d"/></svg><span>BentoBay</span></div>
    <button class="srch" data-act="palette"><span>Search or jump to…</span><kbd id="pk"></kbd></button>
    <nav id="nav"></nav>
    <div class="sb-bottom">
      <div id="pet"></div>
      <button class="item" data-go="wrapped"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span class="lbl">Wrapped</span></button>
      <button class="item" data-go="prompts"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Prompts</span></button>
      <button class="item" data-go="settings"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span class="lbl">Settings</span></button>
    </div>
  </aside>
  <main><header id="top"></header><section id="stage"><div id="page"></div><div id="snap"></div><div id="lock"></div></section></main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="core.js"></script><script src="pages.js"></script><script src="app.js"></script>
</body></html>
